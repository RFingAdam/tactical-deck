<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Protocol HUD Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Teko:wght@500;600;700&family=Barlow+Condensed:wght@600;700&family=Share+Tech+Mono&family=Black+Ops+One&family=Stardos+Stencil:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--kill:#ff5a2a;--death:#5fa8ff;--win:#ffc93c;--cash:#3ddc84;--ink:#f3f5f8;--glass:rgba(9,11,15,.78)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:"Chakra Petch",system-ui,sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#fx{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}

/* ---------- HUD ---------- */
#hud{position:absolute;display:flex;flex-direction:column;gap:8px;transform-origin:top left}
.pos-tl{left:36px;top:36px}
.pos-tr{right:36px;top:36px;align-items:flex-end;transform-origin:top right!important}
.pos-bl{left:36px;bottom:36px;flex-direction:column-reverse!important;transform-origin:bottom left!important}
.pos-br{right:36px;bottom:36px;align-items:flex-end;flex-direction:column-reverse!important;transform-origin:bottom right!important}
.brand{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.42em;font-weight:700;color:rgba(255,255,255,.72);text-transform:uppercase}
.brand .dot{width:8px;height:8px;border-radius:50%;background:#ff2d2d;box-shadow:0 0 10px #ff2d2d;animation:blink 1.4s infinite}
.bar{display:flex;gap:6px}
.tile{position:relative;width:150px;height:106px;background:var(--glass);overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);box-shadow:0 0 14px var(--c)}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.tile .lbl{position:absolute;left:14px;top:12px;font-size:13px;letter-spacing:.3em;font-weight:700;color:var(--c)}
.tile .num{position:absolute;left:12px;bottom:-8px;font-family:Teko,sans-serif;font-size:82px;line-height:1;font-weight:600;
  text-shadow:0 0 18px var(--gb)}
.tile .ico{position:absolute;right:14px;top:10px;width:22px;height:22px;opacity:.55}
.t-kill{--c:var(--kill);--gb:rgba(255,90,42,.45)}
.t-death{--c:var(--death);--gb:rgba(95,168,255,.45)}
.t-win{--c:var(--win);--gb:rgba(255,201,60,.5)}
.t-cash{--c:var(--cash);--gb:rgba(61,220,132,.42);width:210px}
.t-cash.neg{--c:#ff6b6b;--gb:rgba(255,107,107,.4)}
.tile .num.money{font-size:58px;bottom:-3px;letter-spacing:.01em}
.tile.hit{animation:hit .55s ease-out}
.num.tick{animation:tick .45s cubic-bezier(.2,1,.3,1)}
.sub{display:flex;gap:18px;align-items:center;padding:7px 16px;background:var(--glass);font-size:14px;letter-spacing:.18em;font-weight:700;
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);width:max-content}
.sub b{font-family:Teko,sans-serif;font-size:24px;letter-spacing:.04em;font-weight:600;margin-left:6px;vertical-align:-2px}
.sub .hot b{color:var(--kill);text-shadow:0 0 12px rgba(255,90,42,.8)}
.sub .dim{color:rgba(255,255,255,.55)}


/* ---------- bar layout: lives in the letterbox strip above the game ---------- */
.pos-bar{left:40px;top:19px;flex-direction:row!important;align-items:flex-start;gap:10px!important}
.pos-bar .brand{display:none!important}
.pos-bar .tile{height:100px;width:136px}
.pos-bar .tile .num{font-size:74px}
/* debt tracker: its own corner, so the kill/death tiles and the feed keep their positions */
#cashbox{position:absolute;right:36px;top:36px;transform-origin:top right}
body.layout-tr #cashbox{right:auto;left:36px;transform-origin:top left}
body.layout-bar #cashbox{right:40px;top:19px}
body.layout-bar #cashbox .tile{height:100px;width:196px}
body.layout-bar #cashbox .tile .num.money{font-size:54px}
.pos-bar .sub{flex-direction:column;align-items:flex-start;gap:2px;padding:8px 22px 8px 14px;height:100px;box-sizing:border-box;justify-content:center;font-size:12px;line-height:1.05;
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.pos-bar .sub b{font-size:21px}
.pos-bar #feed{flex-direction:row;gap:8px}
body.layout-bar #callout{top:205px}
body.layout-bar #kia{top:330px}
.pos-bar .pop{height:100px;min-width:260px;flex-direction:row}

/* ---------- feed pops ---------- */
#feed{display:flex;flex-direction:column;gap:6px}
.pos-bl #feed,.pos-br #feed{flex-direction:column-reverse}
.pop{--c:var(--kill);display:flex;align-items:center;gap:14px;min-width:300px;height:64px;padding:0 26px 0 16px;
  background:linear-gradient(90deg,rgba(9,11,15,.9),rgba(9,11,15,.62));border-left:4px solid var(--c);
  clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);animation:popin .38s cubic-bezier(.2,1.25,.3,1) both}
.pop .pt{font-family:Teko,sans-serif;font-size:40px;font-weight:600;letter-spacing:.06em;line-height:.9;padding-top:6px}
.pop .ps{font-size:12px;letter-spacing:.28em;color:var(--c);font-weight:700}
.pop .pv{margin-left:auto;font-family:Teko,sans-serif;font-size:42px;color:var(--c);padding-top:7px;text-shadow:0 0 14px var(--c)}
.pop.out{animation:popout .4s ease-in forwards}
.pos-tr .pop,.pos-br .pop{border-left:none;border-right:4px solid var(--c);clip-path:polygon(16px 0,100% 0,100% 100%,0 100%);padding:0 16px 0 30px}

/* ---------- streak callout ---------- */
#callout{--c:var(--kill);position:absolute;left:0;right:0;top:118px;text-align:center;opacity:0;pointer-events:none}
#callout .t{font-family:Teko,sans-serif;font-size:96px;line-height:.9;font-weight:600;letter-spacing:.14em;color:#fff;
  text-shadow:0 0 18px var(--c),0 4px 0 rgba(0,0,0,.55)}
#callout .s{font-size:16px;letter-spacing:.6em;color:var(--c);font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#callout .ln{height:3px;width:0;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--c),transparent)}
#callout.on{animation:slam 2.4s cubic-bezier(.2,.9,.2,1) forwards}
#callout.on .ln{animation:line 2.4s ease-out forwards}

/* ---------- death ---------- */
#vig{position:absolute;inset:0;opacity:0;pointer-events:none;box-shadow:inset 0 0 240px 40px rgba(200,20,20,.55)}
#vig.on{animation:vig 1.2s ease-out forwards}
#kia{position:absolute;left:0;right:0;top:290px;text-align:center;opacity:0;pointer-events:none}
#kia .t{position:relative;display:inline-block;font-family:Teko,sans-serif;font-size:124px;line-height:.9;font-weight:600;letter-spacing:.16em;
  color:#fff;text-shadow:0 0 16px rgba(255,40,40,.55),0 4px 0 rgba(0,0,0,.5)}
#kia .t::before,#kia .t::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%}
#kia .t::before{color:#ff2a2a;opacity:.6;clip-path:inset(18% 0 64% 0);animation:gl1 .28s steps(2) infinite}
#kia .t::after{color:#35d4ff;opacity:.5;clip-path:inset(62% 0 22% 0);animation:gl2 .24s steps(2) infinite}
#kia .s{font-size:16px;letter-spacing:.55em;font-weight:700;color:#ff8080;text-shadow:0 2px 6px rgba(0,0,0,.85)}
#kia.on{animation:kia 1.9s forwards}

/* ---------- victory ---------- */
#win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none}
#win .rays{position:absolute;left:50%;top:50%;width:1500px;height:1500px;margin:-750px 0 0 -750px;
  background:repeating-conic-gradient(from 0deg,rgba(255,201,60,.12) 0 4deg,transparent 4deg 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,#000 14%,transparent 60%);animation:spin 10s linear infinite}
#win .glow{position:absolute;left:50%;top:50%;width:900px;height:420px;margin:-210px 0 0 -450px;
  background:radial-gradient(ellipse,rgba(255,190,40,.35),transparent 70%)}
#win .tag{position:relative;font-size:24px;letter-spacing:.8em;font-weight:700;color:#ffe59a;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#win .wt{position:relative;font-family:Teko,sans-serif;font-size:220px;line-height:.82;font-weight:700;letter-spacing:.05em;
  background:linear-gradient(100deg,#b87400 0%,#ffd24a 32%,#fffbe6 45%,#ffd24a 58%,#b87400 100%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 34px rgba(255,190,40,.6)) drop-shadow(0 8px 0 rgba(0,0,0,.55))}
#win .ws{position:relative;margin-top:6px;font-size:24px;letter-spacing:.4em;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#win.on{animation:winfade 4.6s forwards}
#win.on .wt{animation:winslam 4.6s cubic-bezier(.2,.9,.2,1) forwards,shine 1.5s .35s ease-in-out 2}

/* =====================================================================
   THEMES  (?theme=protocol | fieldkit | nvg | stencil | killfeed)
   Geometry is shared by every theme: tile and pop positions never move,
   so the editing tools that read the top bar keep working.
   ===================================================================== */
.tile .ico{color:var(--c)}
.tile .ico svg,.tile svg.ico{width:22px;height:22px;display:block}
.pos-bar .sub{width:112px}

/* ---------- FIELD KIT: matches the game's own menu chips ---------- */
body.theme-fieldkit{--kill:#e8a33d;--death:#93a7b8;--win:#d8c27a;--cash:#62c04e;--ink:#eef1f3}
.theme-fieldkit .tile{background:rgba(29,31,32,.88);border:1px solid rgba(214,220,226,.24);clip-path:none;border-radius:2px;box-sizing:border-box}
.theme-fieldkit .tile::before{top:auto;bottom:0;height:2px;opacity:.85;box-shadow:none}
.theme-fieldkit .tile::after{display:none}
.theme-fieldkit .tile .lbl{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;letter-spacing:.16em;color:#b9c0c6;top:10px}
.theme-fieldkit .tile .lbl::before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;vertical-align:2px;background:var(--c)}
.theme-fieldkit .tile .num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:52px;line-height:1;bottom:12px;left:13px;color:var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
.theme-fieldkit .tile .num.money{font-size:42px;bottom:14px}
.pos-bar .theme-fieldkit .tile .num,body.theme-fieldkit .pos-bar .tile .num{font-size:52px}
body.theme-fieldkit.layout-bar #cashbox .tile .num.money{font-size:42px}
body.theme-nvg.layout-bar #cashbox .tile .num.money{font-size:38px}
body.theme-stencil.layout-bar #cashbox .tile .num.money{font-size:34px}
body.theme-killfeed.layout-bar #cashbox .tile .num.money{font-size:48px}
.theme-fieldkit .tile .ico{opacity:.9;top:11px}
.theme-fieldkit .sub{background:rgba(29,31,32,.88);border:1px solid rgba(214,220,226,.24);clip-path:none;font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.14em;color:#b9c0c6}
.theme-fieldkit .sub b{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--ink)}
.theme-fieldkit .sub .hot b{color:var(--kill);text-shadow:none}
.theme-fieldkit .pop{background:rgba(29,31,32,.92);border:1px solid rgba(214,220,226,.22);border-left:3px solid var(--c);clip-path:none;box-sizing:border-box}
.theme-fieldkit .pop .pt{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:34px;letter-spacing:.05em;padding-top:2px}
.theme-fieldkit .pop .ps{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;letter-spacing:.18em;color:#aeb6bd}
.theme-fieldkit .pop .pv{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:36px;text-shadow:none;padding-top:2px}
.theme-fieldkit #callout .t{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:84px;letter-spacing:.24em;text-shadow:0 3px 0 rgba(0,0,0,.6)}
.theme-fieldkit #callout .t::before{content:"[ ";color:var(--c);opacity:.75}
.theme-fieldkit #callout .t::after{content:" ]";color:var(--c);opacity:.75}
.theme-fieldkit #callout .s{font-family:"Barlow Condensed",sans-serif;font-size:17px;letter-spacing:.5em;color:#d3d9de}
.theme-fieldkit #callout .ln{height:1px}

/* ---------- NIGHT VISION: green phosphor, scanlines, bloom ---------- */
body.theme-nvg{--kill:#8dff7a;--death:#ffb347;--win:#d8ff8a;--cash:#6dffc0;--ink:#c9ffc1}
.theme-nvg .tile{background:rgba(3,16,7,.86);border:1px solid rgba(120,255,140,.38);clip-path:none;box-sizing:border-box;box-shadow:inset 0 0 22px rgba(80,255,120,.14)}
.theme-nvg .tile::before{display:none}
.theme-nvg .tile::after{background:repeating-linear-gradient(0deg,rgba(130,255,150,.07) 0 1px,transparent 1px 3px)}
.theme-nvg .tile .lbl{font-family:"Share Tech Mono",monospace;font-size:14px;letter-spacing:.2em;color:var(--c);opacity:.85;text-shadow:0 0 8px var(--c)}
.theme-nvg .tile .num{font-family:"Share Tech Mono",monospace;font-size:62px;bottom:2px;left:13px;color:var(--c);text-shadow:0 0 10px var(--c),0 0 26px rgba(120,255,140,.35)}
.theme-nvg .tile .num.money{font-size:40px;bottom:8px}
.theme-nvg .tile .ico{filter:drop-shadow(0 0 4px var(--c))}
.theme-nvg .sub{background:rgba(3,16,7,.86);border:1px solid rgba(120,255,140,.3);clip-path:none;font-family:"Share Tech Mono",monospace;color:#9fe39a;letter-spacing:.12em}
.theme-nvg .sub b{font-family:"Share Tech Mono",monospace;color:var(--ink);text-shadow:0 0 8px rgba(120,255,140,.6)}
.theme-nvg .sub .hot b{color:var(--kill)}
.theme-nvg .pop{background:rgba(3,16,7,.9);border:1px solid rgba(120,255,140,.32);border-left:3px solid var(--c);clip-path:none;box-sizing:border-box;box-shadow:inset 0 0 20px rgba(80,255,120,.12)}
.theme-nvg .pop .pt{font-family:"Share Tech Mono",monospace;font-size:28px;color:var(--c);text-shadow:0 0 10px var(--c);padding-top:0}
.theme-nvg .pop .pt::before{content:"\25B8 "}
.theme-nvg .pop .ps{font-family:"Share Tech Mono",monospace;font-size:12px;letter-spacing:.2em;color:#9fe39a}
.theme-nvg .pop .pv{font-family:"Share Tech Mono",monospace;font-size:30px;padding-top:0}
.theme-nvg #callout .t{font-family:"Share Tech Mono",monospace;font-size:84px;letter-spacing:.2em;color:var(--c);text-shadow:0 0 14px var(--c),0 0 40px rgba(120,255,140,.45)}
.theme-nvg #callout.on .t{animation:nvflick .5s steps(2) 2}
.theme-nvg #callout .s{font-family:"Share Tech Mono",monospace;color:#9fe39a}
@keyframes nvflick{0%{opacity:.35}50%{opacity:1}100%{opacity:.7}}

/* ---------- STENCIL OPS: olive drab plates, stencil type, hazard stripes ---------- */
body.theme-stencil{--kill:#e3b25e;--death:#d0503a;--win:#ecd585;--cash:#a5d65f;--ink:#f1e8cc}
.theme-stencil .tile{background:linear-gradient(160deg,#53643a 0%,#3f4c2b 58%,#323c23 100%);border:2px solid #1d2416;box-sizing:border-box;
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px)}
.theme-stencil .tile::before{top:auto;bottom:0;height:4px;box-shadow:none}
.theme-stencil .tile::after{background:radial-gradient(circle at 8px 8px,rgba(0,0,0,.5) 1.6px,transparent 2.2px),radial-gradient(circle at calc(100% - 8px) 8px,rgba(0,0,0,.5) 1.6px,transparent 2.2px),
  repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px)}
.theme-stencil .tile .lbl{font-family:"Stardos Stencil",serif;font-weight:700;font-size:16px;letter-spacing:.14em;color:#e6dbb8;left:16px}
.theme-stencil .tile .num{font-family:"Black Ops One",sans-serif;font-size:60px;bottom:4px;left:15px;color:var(--ink);text-shadow:0 3px 0 rgba(0,0,0,.45)}
.theme-stencil .tile .num.money{font-size:36px;bottom:12px}
.theme-stencil .tile .ico{opacity:.95;right:12px}
.theme-stencil .sub{background:linear-gradient(160deg,#4a5a33,#323c23);border:2px solid #1d2416;clip-path:none;font-family:"Stardos Stencil",serif;font-weight:700;color:#e6dbb8}
.theme-stencil .sub b{font-family:"Black Ops One",sans-serif;font-size:20px;color:var(--ink)}
.theme-stencil .sub .hot b{color:var(--kill);text-shadow:none}
.theme-stencil .pop{background:linear-gradient(160deg,#4a5a33,#323c23);border:2px solid #1d2416;border-left:8px solid var(--c);clip-path:none;box-sizing:border-box}
.theme-stencil .pop.k-death{border-left:2px solid #1d2416;padding-left:22px;background:repeating-linear-gradient(-45deg,var(--death) 0 7px,#1b1b17 7px 14px) left/12px 100% no-repeat,linear-gradient(160deg,#4a5a33,#323c23)}
.theme-stencil .pop .pt{font-family:"Black Ops One",sans-serif;font-size:30px;letter-spacing:.04em;color:var(--ink);padding-top:2px}
.theme-stencil .pop .ps{font-family:"Stardos Stencil",serif;font-weight:700;font-size:14px;letter-spacing:.16em}
.theme-stencil .pop .pv{font-family:"Black Ops One",sans-serif;font-size:32px;text-shadow:none;padding-top:2px}
.theme-stencil #callout .t{font-family:"Black Ops One",sans-serif;font-size:92px;letter-spacing:.08em;color:var(--ink);text-shadow:0 5px 0 rgba(0,0,0,.5)}
.theme-stencil #callout.on .t{display:inline-block;transform:rotate(-2deg)}
.theme-stencil #callout .s{font-family:"Stardos Stencil",serif;font-weight:700;font-size:18px;letter-spacing:.4em}

/* ---------- KILLFEED: no plates, clean numerals, thin colour rules ---------- */
body.theme-killfeed{--kill:#ff6a3d;--death:#4aa3ff;--win:#ffd34d;--cash:#43e08a;--ink:#ffffff}
.theme-killfeed .tile{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0));clip-path:none}
.theme-killfeed .tile::before{top:auto;bottom:0;height:2px;box-shadow:0 0 10px var(--c)}
.theme-killfeed .tile::after{display:none}
.theme-killfeed .tile .lbl{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:14px;letter-spacing:.26em;color:rgba(255,255,255,.72)}
.theme-killfeed .tile .num{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:70px;bottom:-6px;color:var(--ink);text-shadow:0 2px 14px rgba(0,0,0,.6)}
.theme-killfeed .tile .num.money{font-size:50px;bottom:6px}
.theme-killfeed .tile .ico{opacity:.8}
.theme-killfeed .sub{background:transparent;clip-path:none;font-family:"Rajdhani",sans-serif;font-weight:700;color:rgba(255,255,255,.7)}
.theme-killfeed .sub b{font-family:"Rajdhani",sans-serif;font-weight:700;color:#fff}
.theme-killfeed .pop{background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,0));border-left:2px solid var(--c);clip-path:none}
.theme-killfeed .pop .pt{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:32px;letter-spacing:.06em;padding-top:2px}
.theme-killfeed .pop .ps{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:13px;letter-spacing:.24em}
.theme-killfeed .pop .pv{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:32px;text-shadow:none;padding-top:2px}
.theme-killfeed #callout .t{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:78px;letter-spacing:.38em;text-shadow:0 2px 18px rgba(0,0,0,.7)}
.theme-killfeed #callout .s{font-family:"Rajdhani",sans-serif;font-weight:700}

/* ---------- keyframes ---------- */
@keyframes blink{50%{opacity:.25}}
@keyframes hit{0%{transform:scale(1)}18%{transform:scale(1.09);background:var(--gb)}100%{transform:scale(1)}}
@keyframes tick{0%{transform:translateY(60%);opacity:0;filter:blur(6px)}100%{transform:none;opacity:1;filter:none}}
@keyframes popin{0%{opacity:0;transform:translateX(-40px) skewX(-12deg)}100%{opacity:1;transform:none}}
@keyframes popout{to{opacity:0;transform:translateX(-30px)}}
@keyframes slam{0%{opacity:0;transform:scale(1.25);filter:blur(6px)}10%{opacity:1;transform:scale(1);filter:none}15%{transform:scale(1)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-14px)}}
@keyframes line{0%{width:0}20%{width:720px}100%{width:720px;opacity:0}}
@keyframes vig{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes kia{0%{opacity:0;transform:scale(1.25)}8%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
@keyframes gl1{0%{transform:translate(-6px,-2px)}50%{transform:translate(5px,1px)}100%{transform:translate(-3px,2px)}}
@keyframes gl2{0%{transform:translate(6px,2px)}50%{transform:translate(-5px,-1px)}100%{transform:translate(3px,-2px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes winfade{0%{opacity:0}6%{opacity:1}86%{opacity:1}100%{opacity:0}}
@keyframes winslam{0%{transform:scale(1.35);opacity:0;filter:blur(8px)}9%{transform:scale(1);opacity:1;filter:none}14%{transform:scale(1)}100%{transform:scale(1.04)}}
@keyframes shine{0%{background-position:100% 0}100%{background-position:0 0}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="vig"></div>
  <div id="hud">
    <div class="brand"><span class="dot"></span>Protocol // Live Stats</div>
    <div class="bar">
      <div class="tile t-kill" id="tk"><div class="lbl">KILLS</div><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#ff5a2a" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg><div class="num" id="nk">0</div></div>
      <div class="tile t-death" id="td"><div class="lbl">DEATHS</div><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#5fa8ff" stroke-width="2"><path d="M12 3a7 7 0 0 0-7 7v4l2 2v3h10v-3l2-2v-4a7 7 0 0 0-7-7z"/><circle cx="9" cy="11" r="1.5"/><circle cx="15" cy="11" r="1.5"/></svg><div class="num" id="nd">0</div></div>
      <div class="tile t-win" id="tw"><div class="lbl">WINS</div><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#ffc93c" stroke-width="2"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8"/></svg><div class="num" id="nw">0</div></div>
    </div>
    <div class="sub"><span>K/D<b id="kd">0.00</b></span><span id="stk" class="dim">STREAK<b id="sv">0</b></span><span class="dim">BEST<b id="bv">0</b></span></div>
    <div id="feed"></div>
  </div>
  <div id="cashbox"><div class="tile t-cash" id="tc"><div class="lbl">STREAM PROFIT</div><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#3ddc84" stroke-width="2"><path d="M12 2v20M17 6.5C17 4.6 14.8 3 12 3S7 4.6 7 6.5 9.2 9.5 12 10s5 1.6 5 3.5-2.2 3.5-5 3.5-5-1.6-5-3.5"/></svg><div class="num money" id="nc">$0</div></div></div>
  <div id="callout"><div class="t"></div><div class="s"></div><div class="ln"></div></div>
  <div id="kia"><div class="t" data-t="K.I.A.">K.I.A.</div><div class="s"></div></div>
  <div id="win"><div class="glow"></div><div class="rays"></div><div class="tag">MATCH COMPLETE</div><div class="wt">VICTORY</div><div class="ws"></div></div>
</div>
<script src="overlay.js"></script>
</body>
</html>
